name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Show toolchain
        run: |
          sw_vers
          swift --version
          xcodebuild -version

      - name: Test
        run: swift test

      - name: Build app
        run: make app

      - name: Verify bundle
        run: |
          codesign --verify --deep --strict --verbose=2 "build/Headphone EQ.app"
          test -f "build/Headphone EQ.app/Contents/Resources/Assets.car"
          test -f "build/Headphone EQ.app/Contents/Resources/AppIcon.icns"
