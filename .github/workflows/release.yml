name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Prepare version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a semantic version tag such as v1.0.0" >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "ARCHIVE=build/HeadphoneLabMenu-$VERSION-macOS.zip" >> "$GITHUB_ENV"
          plutil -replace CFBundleShortVersionString -string "$VERSION" Resources/Info.plist
          plutil -replace CFBundleVersion -string "$GITHUB_RUN_NUMBER" Resources/Info.plist

      - name: Test
        run: swift test

      - name: Build archive
        run: make archive VERSION="$VERSION"

      - name: Verify release
        run: |
          codesign --verify --deep --strict --verbose=2 \
            "build/Headphone Lab Menu.app"
          ditto -x -k "$ARCHIVE" build/release-check
          codesign --verify --deep --strict --verbose=2 \
            "build/release-check/Headphone Lab Menu.app"
          shasum -a 256 "$ARCHIVE" > "$ARCHIVE.sha256"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "$ARCHIVE" \
            "$ARCHIVE.sha256" \
            --verify-tag \
            --generate-notes \
            --title "Headphone Lab Menu $VERSION"
